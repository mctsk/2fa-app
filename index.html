<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:">
    <title>AuthCodes</title>

    <!-- CSS -->
    <link href="./css/theme.css" rel="stylesheet" />
    <link href="./css/styles.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="./img/icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./img/icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./img/icon.png">

    <!-- Scripts -->
    <script src="./renderer.js"></script>
    <script src="./node_modules/sortablejs/Sortable.min.js"></script>
    <!-- Using separate script tag for twofa.js to ensure DOM is ready or defer -->
</head>

<body>
    <!-- Top Bar -->
    <header class="app-header">
        <h1 class="app-title">AuthCodes</h1>
        <div class="header-actions">
            <button id="theme-toggle" class="icon-btn" title="Tema Değiştir">
                <i class="material-icons">light_mode</i>
            </button>
            <button id="add-btn" class="icon-btn" title="Yeni Ekle">
                <i class="material-icons">add</i>
            </button>
        </div>
    </header>

    <!-- Account List -->
    <ul id="account-list" class="account-list">
        <!-- Accounts will be injected here by JS -->
    </ul>

    <!-- Bottom Actions -->
    <!-- Bottom Actions Removed -->

    <!-- Modals (Custom implementation) -->

    <!-- Delete Modal -->
    <div id="deleteModal" class="custom-modal">
        <div class="modal-content">
            <h3 class="modal-title">Sil</h3>
            <p>Silmek istediğinizden emin misiniz?</p>
            <div class="modal-actions">
                <button class="btn btn-secondary js-modal-close">Kapat</button>
                <button id="confirm-delete-btn" class="btn btn-danger">Sil</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="addNewModal" class="custom-modal">
        <div class="modal-content">
            <h3 class="modal-title" id="modalTitle">Ekle / Düzenle</h3>
            <div class="form-group">
                <label for="name" class="form-label">Hesap Adı</label>
                <input type="text" id="name" class="form-input" placeholder="Örn: Google">
            </div>
            <div class="form-group">
                <label for="icon-url" class="form-label">Simge URL (Opsiyonel)</label>
                <input type="text" id="icon-url" class="form-input" placeholder="https://example.com/icon.png">
            </div>
            <div class="form-group">
                <label for="secret" class="form-label">Gizli Anahtar (Secret)</label>
                <input type="text" id="secret" class="form-input" placeholder="Anahtarı buraya yapıştırın">
            </div>
            <div class="form-group qr-group" id="qr-container" style="display: none;">
                <label class="form-label text-center">QR Kodu</label>
                <div class="qr-canvas-wrapper">
                    <canvas id="qr-canvas"></canvas>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary js-modal-close">Kapat</button>
                <button id="save-btn" class="btn btn-primary">Kaydet</button>
            </div>
        </div>
    </div>

    <script src="./twofa.js"></script>
</body>

</html>
