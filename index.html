<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP --> 
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <title>AuthCodes</title>
    <link href="./css/index.css" rel="stylesheet" />
    <link href="./css/template-dark.css" rel="stylesheet" />
    <link rel="apple-touch-icon" sizes="180x180" href="./img/icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./img/icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./img/icon.png">
    <script src="./renderer.js"></script>
    <script src="./twofa.js"></script>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.js"></script>
    <script src="./node_modules/material-components-web/dist/material-components-web.min.js"></script>
</head>

<body>
    <header class="mdc-top-app-bar mdc-top-app-bar--dense">
        <div class="mdc-top-app-bar__row">
            <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-start">
                <span class="mdc-top-app-bar__title">
                    <img src="./img/icon.png" class="header-logo" />
                    AuthCodes
                </span>
            </section>
            <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-end" role="toolbar">
                <a href="#" aria-label="Edit" class="mdc-icon-button material-icons edit-btn" title="Düzenle">tune</a>
            </section>
        </div>
    </header>
    <ul class="container-fluid twofa-list mdc-list mdc-list--two-line" id="sortable">
    </ul>
    <a href="#" class="addnew" aria-label="Yeni ekle">
        <button class="mdc-fab fab-fixed" aria-label="Add">
            <span class="mdc-fab__ripple"></span>
            <span class="mdc-fab__icon material-icons">add</span>
        </button>
    </a>
    <div class="mdc-dialog" id="deleteModal">
        <div class="mdc-dialog__container">
            <div class="mdc-dialog__surface" role="alertdialog" aria-modal="true" aria-label="Sil">
                <h6 class="mdc-dialog__title">Sil</h6>
                <div class="mdc-dialog__content small">
                    <p>Silmek İstediğinizden emin misiniz ?</p>
                </div>
                <div class="mdc-dialog__actions">
                    <button type="button" class="mdc-button mdc-dialog__button" data-mdc-dialog-action="close"><span class="mdc-button__label">Kapat</span></button>
                    <button type="button" class="mdc-button mdc-dialog__button delete-btn" data-mdc-dialog-action="accept"><span class="mdc-button__label">Sil</span></button>
                </div>
            </div>
        </div>
        <div class="mdc-dialog__scrim"></div>
    </div>
    <div class="mdc-dialog" id="addNewModal">
        <div class="mdc-dialog__container">
            <div class="mdc-dialog__surface" role="alertdialog" aria-modal="true" aria-label="Ekle / Düzenle">
                <h6 class="mdc-dialog__title">Ekle / Düzenle</h6>
                <div class="mdc-dialog__content">
                    <div class="mb-3">
                        <label for="name" class="form-label small">İsim</label>
                        <input type="text" class="form-control form-control-sm" id="name">
                    </div>
                    <div class="mb-3">
                        <label for="secret" class="form-label small">Secret</label>
                        <input type="text" class="form-control form-control-sm" id="secret">
                    </div>
                </div>
                <div class="mdc-dialog__actions">
                    <button type="button" class="mdc-button mdc-dialog__button" data-mdc-dialog-action="close"><span class="mdc-button__label">Kapat</span></button>
                    <button type="button" class="mdc-button mdc-dialog__button save-btn" data-mdc-dialog-action="accept"><span class="mdc-button__label">Kaydet</span></button>
                </div>
            </div>
        </div>
        <div class="mdc-dialog__scrim"></div>
    </div>
    <div class="mdc-snackbar" id="snackbar">
        <div class="mdc-snackbar__surface" role="status" aria-relevant="additions">
            <div class="mdc-snackbar__label" aria-atomic="false"></div>
        </div>
    </div>
</body>

</html>
